<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador de click</title>
  <style>
    :root {
      color-scheme: dark light;
    }

    /* estilos del botón */
    .clickBtn {
      padding: 10px 20px;
      font-weight: 500;
      margin-bottom: 20px;
      cursor: pointer;
    }

    .counter {
      font-weight: 500;
      color: #333;
    }
  </style>
</head>
<body style="font-family: Arial, Helvetica, sans-serif; text-align: center; margin-top: 100px;">
  
  <main class="main">
    <h1>Contador</h1>
    <!-- Crear el botón -->
    <p class="counter">Clicks: 0</p>
  </main>

  <script>
    let count = 0
    const bt = document.querySelector('.clickBtn')
    const display = document.querySelector('.counter')

    bt.addEventListener('click', () => {
      count++
      display.textContent = `clicks: ${count}`
    })

  </script>
</body>
</html>
