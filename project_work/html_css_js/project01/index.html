<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar fondo</title>
    <style>
      button {
        padding: 10px 20px;
        font-weight: 600;
        cursor: pointer;
      }

      .fond {
        background-color: #222;
      }
    </style>
  </head>
  <body style="background-color: #dedede; font-family: Arial, Helvetica, sans-serif; text-align: center; padding: 8px;">
    
    <main class="main">
      <h1>Cambiar color del fondo</h1>
      <!-- Crear el botón para cambiar el color -->
    </main>

    <script>
      const btn = document.querySelector('.colorBtn')
      let body = document.body.classList        
      btn.addEventListener('click', () => {
        console.log(body.value === '');
        if (body.value === '') {
          body.add('fond')
        } else {
          body.remove('fond')
        }
      })
    </script>  
  </body>
</html>
